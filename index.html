<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Factorio reverse calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <header class="top">
        <select id="lang" aria-label="Language"></select>
        <h1 data-i18n="title"></h1>
        <p data-i18n="subtitle"></p>
    </header>
    <section class="card bar">
        <div class="itemrate">
            <button class="curbtn" id="chg" data-i18n-attr="aria-label:change.aria"><span id="curicon"
                    class="t"></span><span class="curname" id="curname"></span><span class="chev"
                    data-i18n="change"></span></button>
            <div class="row">
                <div><label for="rate" data-i18n="amount"></label><input id="rate" type="number" inputmode="decimal"
                        min="0" step="any" value="20"></div>
                <div><label for="unit" data-i18n="unit"></label><select id="unit">
                        <option value="s" data-i18n="per.s"></option>
                        <option value="m" data-i18n="per.m"></option>
                    </select></div>
            </div>
        </div>
        <details class="cfg" id="cfg">
            <summary><span data-i18n="phase"></span><span class="cfgsum" id="cfgsum"></span></summary>
            <div class="cfgbody">
                <div class="presets" id="presets"></div>
                <div id="mach"></div>
            </div>
        </details>
    </section>
    <main>
        <section class="card picker" id="picker" data-i18n-attr="aria-label:pick.aria">
            <div class="pkhead">
                <h2 data-i18n="pick.title"></h2><button class="btn" id="pkclose" data-i18n="close"></button>
            </div>
            <div class="tabs" id="tabs"></div>
            <input id="q" type="search" data-i18n-attr="placeholder:search.ph;aria-label:search.aria">
            <div class="gw">
                <div class="grid" id="pick"></div>
            </div>
        </section>
        <div class="res">
            <div class="sum" id="sum"></div>
            <nav class="views" id="views"><button class="btn" data-v="diag" data-i18n="view.diag"></button><button
                    class="btn" data-v="steps" data-i18n="view.steps"></button><button class="btn" data-v="raw"
                    data-i18n="view.raw"></button><button class="btn" data-v="table" data-i18n="view.table"></button></nav>
            <section class="card" id="v-diag">
                <div class="crumbs" id="crumbs"></div>
                <div class="dtools"><button class="btn" id="zo" data-i18n-attr="aria-label:zoom.out">−</button><button
                        class="btn" id="zi" data-i18n-attr="aria-label:zoom.in">+</button><button class="btn" id="zf"
                        data-i18n="zoom.fit"></button><button class="btn" id="zfs" aria-pressed="false"></button></div>
                <div class="vp" id="diag"></div>
                <p class="note" data-i18n="note"></p>
            </section>
            <section class="card" id="v-steps" hidden>
                <h2 data-i18n="steps.title"></h2>
                <p class="note" data-i18n="ins.note"></p>
                <div class="cards" id="steps"></div>
            </section>
            <section class="card" id="v-table" hidden>
                <p class="note" data-i18n="tbl.note"></p>
                <div id="table"></div>
            </section>
            <section class="card" id="v-raw" hidden>
                <h2 data-i18n="raw.title"></h2>
                <div class="cards" id="raw"></div>
            </section>
        </div>
    </main>
    <script src="data/data.js"></script>
    <script src="data/icons.js"></script>
    <script src="js/engine.js"></script>
    <script src="data/names.es.js" onerror="this.remove()"></script>
    <script src="data/names.ca.js" onerror="this.remove()"></script>
    <script src="js/app.js"></script>
</body>

</html>
